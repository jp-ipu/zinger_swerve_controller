swerve_controller:
  ros__parameters:

    robot_base_frame: base_footprint

    twist_topic: cmd_vel

    position_controller_name: "drive_module_steering_angle_controller"
    velocity_controller_name: "drive_module_velocity_controller"

    cycle_frequency: 50

    # Robot geometry (meters)
    robot_length: 0.35
    robot_width: 0.30
    steering_radius: 0.05
    wheel_radius: 0.04
    wheel_width: 0.05

    # Motor constraints
    steering_motor_max_velocity: 10.0      # rad/s
    steering_motor_min_acceleration: 0.1   # rad/s^2
    steering_motor_max_acceleration: 1.0   # rad/s^2
    drive_motor_max_velocity: 10.0         # m/s
    drive_motor_min_acceleration: 0.1      # m/s^2
    drive_motor_max_acceleration: 1.0      # m/s^2

    # ===========================================
    # 2-WHEEL CONFIGURATION
    # ===========================================
    # Left and right wheels along the lateral axis (y-axis)
    # Both wheels at x=0 (robot center), separated along y-axis
    # This configuration provides good lateral velocity and rotation estimation

    module_names:
      - left
      - right

    # Module positions relative to robot center (meters)
    # Both wheels at x=0, left wheel at +y, right wheel at -y
    module_positions_x:
      - 0.0      # left: on center axis
      - 0.0      # right: on center axis

    module_positions_y:
      - 0.125    # left: +y
      - -0.125   # right: -y

    steering_joints:
      - joint_chassis_to_steering_left
      - joint_chassis_to_steering_right

    drive_joints:
      - joint_steering_to_wheel_left
      - joint_steering_to_wheel_right
